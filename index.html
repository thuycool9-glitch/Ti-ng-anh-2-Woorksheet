<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 2 Worksheet – The Big Adventure</title>
<style>
:root{--ink:#2b2d5b;--o:#ff922b;--g:#40c057;--b:#339af0;--p:#f06595;--pu:#845ef7}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#bfe9ff,#eaf9ff 55%,#d3f3c4);min-height:100vh;overflow-x:hidden}
.wrap{max-width:980px;margin:auto;padding:12px}
.card{background:#fff;border-radius:26px;padding:16px;box-shadow:0 8px 28px #4a6fa533;border:4px solid #fff;margin-bottom:14px}
.btn{font:inherit;font-weight:800;font-size:clamp(17px,4vw,24px);padding:12px 26px;border:0;border-radius:40px;background:var(--o);color:#fff;box-shadow:0 6px 0 #c9660d;cursor:pointer;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9660d}.btn.g{background:var(--g);box-shadow:0 6px 0 #2b8a3e}.btn.b{background:var(--b);box-shadow:0 6px 0 #1864ab}.btn.gh{background:#adb5bd;box-shadow:0 6px 0 #868e96}.btn.sm{font-size:clamp(15px,3.5vw,20px);padding:9px 20px}
h1{font-size:clamp(28px,7vw,52px);margin:6px 0;color:#e8590c;text-shadow:3px 3px 0 #fff,5px 5px 0 #ffd43b;line-height:1.05}
h1 small{display:block;font-size:.5em;color:var(--pu);text-shadow:2px 2px 0 #fff}
.c{text-align:center}.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.chip{background:#fff7d6;border:3px solid #ffd43b;border-radius:30px;padding:4px 14px;font-weight:800;font-size:clamp(14px,3.6vw,19px)}
.bar{height:16px;background:#e9ecef;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#51cf66,#ffd43b);border-radius:10px;transition:width .5s}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.node{border:0;border-radius:22px;padding:12px 6px;color:#fff;font:inherit;cursor:pointer;box-shadow:0 6px 0 #0003;position:relative;transition:.15s}
.node:hover{transform:translateY(-4px) rotate(-1deg)}.node b{display:block;font-size:clamp(14px,3.4vw,17px)}.node .ic{font-size:40px}.node .md{position:absolute;top:2px;right:6px;font-size:26px}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.opt{font:inherit;font-weight:800;font-size:clamp(18px,4.6vw,28px);padding:14px 8px;border-radius:20px;border:4px solid #d0e1ff;background:#fff;color:var(--ink);cursor:pointer}
.opt:hover{background:#f1f7ff}.opt.ok{background:#b2f2bb;border-color:#40c057}.opt.no{background:#ffc9c9;border-color:#ff6b6b}
.tag{display:inline-block;background:var(--pu);color:#fff;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:800}
#qp{font-size:clamp(18px,4.4vw,26px);font-weight:800;margin:8px 0}
.pic{max-height:210px;max-width:min(100%,330px);border-radius:18px;display:block;margin:6px auto}
.sent{font-size:clamp(22px,5.5vw,34px);font-weight:800;margin:8px 0}.blank{display:inline-block;min-width:110px;border-bottom:4px dashed var(--o);color:#2b8a3e}
.fb{min-height:44px;font-size:clamp(20px,5vw,30px);font-weight:900;margin:8px 0}.fb.good{color:#2b8a3e;animation:pop .5s}.fb.bad{color:#e03131}.fb.try{color:#e8590c}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.sk{animation:sk .45s}@keyframes sk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.in{font:inherit;font-size:clamp(20px,5vw,30px);padding:10px 14px;border:4px solid #d0e1ff;border-radius:18px;text-align:center;width:min(260px,70%)}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slots span,.tile{width:46px;height:52px;border-radius:12px;border:3px dashed #adb5bd;font:inherit;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;background:#f8f9fa}
.tile{border:3px solid #ffa94d;background:#fff4e6;cursor:pointer;color:var(--ink)}.tile:disabled{opacity:.25}
.mt{display:flex;gap:18px;justify-content:center}.mt>div{display:flex;flex-direction:column;gap:10px;flex:1;max-width:260px}
.mi,.mw{font:inherit;font-weight:800;border:4px solid #d0e1ff;background:#fff;border-radius:16px;cursor:pointer;color:var(--ink)}
.mi{height:92px;padding:4px}.mi img{max-height:80px;max-width:100%}.mw{height:92px;font-size:clamp(16px,4vw,24px)}.sel{border-color:var(--o);background:#fff4e6}.mi.ok,.mw.ok{background:#b2f2bb;border-color:#40c057}
.odd{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.odd .opt{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}.odd img{max-height:90px;max-width:100%}
.cnt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.cnt img{height:64px}
canvas{max-width:100%;border:3px solid #dee2e6;border-radius:14px;touch-action:manipulation;background:#fff}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #adb5bd;cursor:pointer}.sw.on{box-shadow:0 0 0 5px var(--ink);transform:scale(1.15)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.wn{font-weight:900;font-size:clamp(16px,4vw,22px)}
.tbl{width:100%;font-size:clamp(16px,4vw,22px);border-collapse:collapse}.tbl td{padding:6px 10px;border-bottom:2px dashed #dee2e6}.tbl td:last-child{text-align:right;font-weight:900}
.big{font-size:clamp(60px,18vw,110px)}.ttl{font-size:clamp(26px,7vw,44px);font-weight:900;color:#e8590c}
#fx i{position:fixed;top:-40px;font-style:normal;pointer-events:none;z-index:99;animation:fall linear forwards}@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(540deg)}}
.cl{position:fixed;font-size:60px;opacity:.5;z-index:-1;animation:dr 40s linear infinite}@keyframes dr{from{left:-100px}to{left:110vw}}
</style></head><body>

const say=(t,c)=>{const f=$('#fb');if(f){f.className='fb '+c;f.textContent=t}};

const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
/* ---------- HOME ---------- */
function home(){cur=null;const s=stats();
go(`<div class="card c"><div class="big fl">🎒🌈</div><h1>ENGLISH 2 WORKSHEET<small>THE BIG ADVENTURE</small></h1>
<div class="stats"><span class="chip">⭐ Stars: ${s.f}</span><span class="chip">🏆 Score: ${s.p}</span><span class="chip">✅ ${s.n}/100</span>${ST.best?`<span class="chip">🥇 Best: ${esc(ST.best.name)} – ${ST.best.pts}</span>`:''}</div>${bar(s.n)}
<button class="btn g" id="st">▶ START GAME</button><button class="btn b" id="hw">❓ HOW TO PLAY</button><button class="btn gh sm" id="rs">📊 My Results</button><button class="btn gh sm" id="mt">${mute?'🔇':'🔊'}</button></div>
<div class="card"><div class="ttl c">🗺️ Choose a World</div><div class="map">${WORLDS.map((w,i)=>{const a=ans(i),d=a.length==10;return`<button class="node" data-w="${i}" style="background:${w.c}">${d?'<span class="md">🏅</span>':''}<span class="ic">${w.ic}</span><b>${i+1}. ${w.n}</b><span>${a.length}/10 · ⭐${a.reduce((x,y)=>x+y.f,0)}</span></button>`}).join('')}</div></div>`);
$$('.node').forEach(e=>e.onclick=()=>startWorld(+e.dataset.w));
$('#st').onclick=()=>{snd('ok');ST.name?begin():askName()};
$('#hw').onclick=how;$('#rs').onclick=summary;$('#mt').onclick=()=>{mute=!mute;home()}}
function begin(){const w=WORLDS.findIndex((_,i)=>ans(i).length<10);w<0?summary():startWorld(w)}
function askName(){go(`<div class="card c"><div class="big fl">🦄</div><div class="ttl">What is your name?</div><p><input class="in" id="nm" maxlength="14" placeholder="Your name" value="${esc(ST.name)}"></p><button class="btn g" id="go">Let's go! ▶</button><button class="btn gh sm" id="bk">Back</button></div>`);
const f=()=>{ST.name=($('#nm').value.trim()||'Super Kid').slice(0,14);save();begin()};$('#go').onclick=f;$('#nm').onkeydown=e=>{if(e.key=='Enter')f()};$('#bk').onclick=home}
function how(){go(`<div class="card"><div class="ttl c">❓ How to Play</div><div style="font-size:clamp(16px,4vw,21px);line-height:1.6"><p>🗺️ Pick a world. Each world has <b>10 questions</b>. (Chọn một thế giới, mỗi thế giới có 10 câu hỏi.)</p><p>✅ Right the first time = <b>10 points</b> ⭐. Right after trying again = <b>5 points</b>.</p><p>🔁 Wrong? Try again! After 2 tries we show the right answer. (Sai thì thử lại, sau 2 lần sẽ hiện đáp án.)</p><p>🧩 Match: tap a picture, then tap its word. 🔤 Scramble: tap letters in order. 🎨 Color: pick a color, tap the picture, press Check.</p><p>🏅 Finish a world to get a medal. Finish all 10 worlds to win the 🏆 trophy!</p></div><div class="c"><button class="btn g" id="bk">Got it!</button></div></div>`);$('#bk').onclick=home}
/* ---------- QUIZ ---------- */
function startWorld(w){let a=ans(w);if(a.length==10){if(!confirm('Play this world again? Its score will reset.'))return;WORLDS[w].q.forEach((_,i)=>delete ST.res[w+'.'+i]);save()}
cur={w,list:WORLDS[w].q.map((_,i)=>i).filter(i=>!ST.res[w+'.'+i]),pos:0,rev:false};ST.name||(ST.name='Super Kid');cur.list.length?ask():wend(w)}
function ask(){const[w,i]=cur.rev?cur.list[cur.pos]:[cur.w,cur.list[cur.pos]];Object.assign(cur,{w,i,q:WORLDS[w].q[i],tries:0,lock:false});const q=cur.q,s=stats(),W=WORLDS[w];
go(`<div class="card"><div class="top"><button class="btn gh sm" id="bk">⬅ Map</button><span class="wn">${W.ic} ${W.n}</span><span class="chip">⭐ <b id="st">${s.f}</b></span><span class="chip">🏆 <b id="sc">${s.p}</b></span></div>${bar(cur.rev?cur.pos/cur.list.length*100:ans(w).length*10)}
<div class="c"><span class="tag">${cur.rev?'REVIEW ':''}${cur.rev?cur.pos+1+'/'+cur.list.length:'Question '+(ans(w).length+1)+'/10'} · ${TAG[q.t]}</span><div id="qp">${esc(PR(q))}</div><div id="qb"></div><div class="fb" id="fb"></div><div id="ex"></div><button class="btn g" id="nx" hidden>NEXT ▶</button></div></div>`);
$('#bk').onclick=home;$('#nx').onclick=next;R[q.t](q,$('#qb'))}
function judge(ok){if(cur.lock)return;if(ok){finish(true,cur.tries==0);return true}cur.tries++;if(cur.tries<2){say('Oops! Try Again!','try');shake($('#qb'));snd('bad');return false}finish(false);return false}
const show=q=>q.t=='T'?(q.a?'True':'False'):q.t=='K'?q.c.join(' + '):q.t=='C'?q.n:q.t=='O'?lab(q.odd):q.a;
function ex(q){return q.t=='T'?q.e:q.t=='K'?'Use '+q.c.join(' and ')+'.':q.t=='C'?'Count slowly, one by one!':q.t=='O'?lab(q.odd)+' is different from the others.':q.t=='M'?'':q.t=='F'||q.t=='X'?q.x.replace('___',q.a)+(VI[q.a]?' ('+VI[q.a]+')':''):q.a+' = '+(VI[q.a]||q.a)}
function finish(c,ft){const q=cur.q,p=c?(ft?10:5):0;cur.lock=true;$('#qb').style.pointerEvents='none';
if(!cur.rev){ST.res[cur.w+'.'+cur.i]={c:+c,f:+ft,p};save();const s=stats();$('#st').textContent=s.f;$('#sc').textContent=s.p}
if(c){say((ft?pk(['Excellent!','Great Job!','Wonderful!']):'Good! You did it!')+(cur.rev?'':' +'+p),'good');conf();snd('ok');cur.tm=setTimeout(next,1700)}
else{say('Oops! Answer: '+show(q),'bad');$('#ex').innerHTML='💡 '+esc(ex(q));$$('.opt').forEach(e=>{if(e.textContent==q.a)e.classList.add('ok')});$('#nx').hidden=false}}
function next(){if(cur.tm)clearTimeout(cur.tm);cur.pos++;if(cur.pos<cur.list.length)ask();else cur.rev?(home()):wend(cur.w)}
function wend(w){const a=ans(w),c=a.reduce((x,y)=>x+y.c,0),f=a.reduce((x,y)=>x+y.f,0),all=WORLDS.every((_,i)=>ans(i).length==10);snd('win');conf(60);
go(`<div class="card c"><div class="big fl">🏅</div><div class="ttl">World ${w+1} Complete!</div><p style="font-size:22px"><b>${WORLDS[w].n}</b><br>✅ ${c}/10 correct · ⭐ ${f} stars · 🏆 ${a.reduce((x,y)=>x+y.p,0)} points</p>
${all?'<button class="btn g" id="fin">🏆 SEE MY RESULTS</button>':w<9?'<button class="btn g" id="nw">NEXT WORLD ▶</button>':''}<button class="btn b" id="mp">🗺️ WORLD MAP</button></div>`);
$('#mp').onclick=home;$('#nw')&&($('#nw').onclick=()=>startWorld(w+1));$('#fin')&&($('#fin').onclick=summary)}
/* ---------- QUESTION TYPES ---------- */
function ch(q,b,top){b.innerHTML=top+`<div class="ch">${sh(q.o).map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>`;$$('.opt',b).forEach(e=>e.onclick=()=>{if(cur.lock||e.disabled)return;const ok=e.textContent==q.a;if(ok){e.classList.add('ok');q.t=='F'&&($('.blank',b).textContent=q.a)}else{e.classList.add('no');e.disabled=true}judge(ok)})}
const sent=q=>`<div class="sent">${esc(q.x).replace('___','<span class="blank"></span>')}</div>`;
const R={L:(q,b)=>ch(q,b,im(q.img)),X:(q,b)=>ch(q,b,(q.img?im(q.img):'')+sent(q)),F:(q,b)=>ch(q,b,(q.img?im(q.img):'')+sent(q)),
W:(q,b)=>tin(q,b,String(q.a),false,q.img?im(q.img):''),C:(q,b)=>tin(q,b,String(q.n),true,`<div class="cnt">${Array(q.n).fill(im(q.img,'')).join('')}</div>`),
T:(q,b)=>{b.innerHTML=im(q.img)+`<div class="sent">${esc(q.x)}</div><div class="ch"><button class="opt" data-v="1">✅ True</button><button class="opt" data-v="0">❌ False</button></div>`;$$('.opt',b).forEach(e=>e.onclick=()=>{if(cur.lock||e.disabled)return;const ok=(e.dataset.v=='1')==q.a;e.classList.add(ok?'ok':'no');if(!ok)e.disabled=true;judge(ok)})},
O:(q,b)=>{b.innerHTML=`<div class="odd">${sh(q.k).map(k=>`<button class="opt" data-k="${k}">${im(k,'')}<span>${lab(k)}</span></button>`).join('')}</div>`;$$('.opt',b).forEach(e=>e.onclick=()=>{if(cur.lock||e.disabled)return;const ok=e.dataset.k==q.odd;e.classList.add(ok?'ok':'no');if(!ok)e.disabled=true;judge(ok)})},
S:(q,b)=>{const a=q.a;let sc;do{sc=sh([...a])}while(sc.join('')==a&&a.length>1);let pk2=[];const draw=()=>{b.innerHTML=im(q.img)+`<div class="slots">${[...a].map((_,i)=>`<span>${pk2[i]!=null?sc[pk2[i]].toUpperCase():''}</span>`).join('')}</div><div class="tiles">${sc.map((l,i)=>`<button class="tile" data-i="${i}" ${pk2.includes(i)?'disabled':''}>${l.toUpperCase()}</button>`).join('')}</div><button class="btn gh sm" id="cl">↺ Clear</button>`;
$$('.tile',b).forEach(e=>e.onclick=()=>{if(cur.lock)return;pk2.push(+e.dataset.i);if(pk2.length<a.length)return draw();const w=pk2.map(i=>sc[i]).join('');draw();if(w==a)judge(true);else if(judge(false)===false&&!cur.lock)setTimeout(()=>{pk2=[];draw()},700)});$('#cl',b).onclick=()=>{if(!cur.lock){pk2=[];draw()}}};draw()},
M:(q,b)=>{let sel=null,dn=0,mi=0;const rw=sh(q.p.map(x=>x[1]));b.innerHTML=`<div class="mt"><div>${q.p.map(p=>`<button class="mi" data-k="${p[1]}">${im(p[0],'')}</button>`).join('')}</div><div>${rw.map(w=>`<button class="mw" data-k="${w}">${w}</button>`).join('')}</div></div>`;
$$('.mi',b).forEach(e=>e.onclick=()=>{if(e.classList.contains('ok')||cur.lock)return;$$('.mi',b).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e});
$$('.mw',b).forEach(e=>e.onclick=()=>{if(!sel||e.classList.contains('ok')||cur.lock)return;if(sel.dataset.k==e.dataset.k){sel.classList.remove('sel');sel.classList.add('ok');e.classList.add('ok');sel=null;snd('ok');if(++dn==q.p.length)finish(mi<4,mi==0)}else{mi++;shake(e);shake(sel);snd('bad');say('Oops! Try Again!','try')}})},
K:(q,b)=>{let col='red',W,H,N,D,Og,lt,out,pt,area=0;b.innerHTML=`<canvas id="cv"></canvas><div class="pal">${Object.keys(COLS).map(c=>`<button class="sw${c=='red'?' on':''}" data-c="${c}" title="${c}" style="background:${COLS[c]}"></button>`).join('')}</div><button class="btn sm" id="ck">Check ✓</button><button class="btn gh sm" id="cl">Clear</button>`;
const cv=$('#cv',b),x=cv.getContext('2d'),I=new Image();
const flood=(s,ok,set)=>{const st=[s],seen=new Uint8Array(N);seen[s]=1;while(st.length){const p=st.pop();set(p);const px=p%W,py=p/W|0;for(const[a,c]of[[px-1,py],[px+1,py],[px,py-1],[px,py+1]])if(a>=0&&c>=0&&a<W&&c<H){const n=c*W+a;if(!seen[n]&&ok(n)){seen[n]=1;st.push(n)}}}};
I.onload=()=>{const sc=Math.min(300/I.width,300/I.height);W=I.width*sc|0;H=I.height*sc|0;cv.width=W;cv.height=H;x.drawImage(I,0,0,W,H);D=x.getImageData(0,0,W,H);Og=new Uint8ClampedArray(D.data);N=W*H;lt=new Uint8Array(N);out=new Uint8Array(N);pt=new Uint8Array(N);for(let i=0;i<N;i++)lt[i]=(Og[i*4]+Og[i*4+1]+Og[i*4+2])/3>150?1:0;
for(let i=0;i<N;i++){const px=i%W,py=i/W|0;if((px==0||py==0||px==W-1||py==H-1)&&lt[i]&&!out[i])flood(i,n=>lt[n]&&!out[n],n=>out[n]=1)}for(let i=0;i<N;i++)if(lt[i]&&!out[i])area++};I.src=IMG[q.img];
$$('.sw',b).forEach(e=>e.onclick=()=>{$$('.sw',b).forEach(s=>s.classList.remove('on'));e.classList.add('on');col=e.dataset.c});
cv.onclick=e=>{if(cur.lock||!N)return;const r=cv.getBoundingClientRect(),p=((e.clientY-r.top)*H/r.height|0)*W+((e.clientX-r.left)*W/r.width|0);if(!lt[p]||out[p])return shake(cv);const h=COLS[col],rr=parseInt(h.substr(1,2),16),gg=parseInt(h.substr(3,2),16),bb=parseInt(h.substr(5,2),16),ci=Object.keys(COLS).indexOf(col)+1;
flood(p,n=>lt[n]&&!out[n],n=>{const d=n*4,l=(Og[d]+Og[d+1]+Og[d+2])/765;D.data[d]=rr*l;D.data[d+1]=gg*l;D.data[d+2]=bb*l;pt[n]=ci});x.putImageData(D,0,0)};
$('#cl',b).onclick=()=>{if(cur.lock)return;D.data.set(Og);x.putImageData(D,0,0);pt.fill(0)};
$('#ck',b).onclick=()=>{if(cur.lock||!N)return;let n=0;const u=new Set();for(let i=0;i<N;i++)if(pt[i]){n++;u.add(Object.keys(COLS)[pt[i]-1])}
const ok=n>area*.5&&[...u].every(c=>q.c.includes(c))&&q.c.every(c=>u.has(c));if(ok)judge(true);else{if(judge(false)===false&&!cur.lock)say(n<=area*.5?'Oops! Color more of the picture!':'Oops! Check the color words!','try')}}}};
function tin(q,b,a,num,top){b.innerHTML=top+`<p><input class="in" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" ${num?'type="number" inputmode="numeric"':''} placeholder="${num?'Number':'Type here'}"> <button class="btn sm" id="ck">Check ✓</button></p>`;const f=()=>{if(cur.lock)return;const v=$('#in',b).value.trim().toLowerCase().replace(/\s+/g,' ');if(!v)return shake($('#in',b));if(judge(v==a)===false&&!cur.lock){$('#in',b).value='';$('#in',b).focus()}};$('#ck',b).onclick=f;$('#in',b).onkeydown=e=>{if(e.key=='Enter')f()}}
/* ---------- SUMMARY ---------- */
function summary(){const s=stats(),all=s.n==100,pct=s.n?Math.round(s.c/s.n*100):0,wr=s.n-s.c,rv=Object.keys(ST.res).filter(k=>!ST.res[k].f).length;
const ti=!all?'KEEP GOING!':pct>=90?'ENGLISH SUPER STAR':pct>=80?'ENGLISH CHAMPION':pct>=60?'GREAT LEARNER':'KEEP PRACTICING!';
if(all){snd('win');conf(70);if(!ST.best||s.p>ST.best.pts){ST.best={name:ST.name||'Super Kid',pts:s.p,pct};save()}}
go(`<div class="card c"><div class="big fl">${all?'🏆':'📊'}</div><div class="ttl">${all?'CONGRATULATIONS!':'My Results'}</div><div class="ttl" style="color:var(--pu)">${esc(ST.name||'Super Kid')}</div><div class="ttl" style="font-size:clamp(22px,6vw,36px)">${all?'🌟 ':''}${ti}${all?' 🌟':''}</div>
<table class="tbl"><tr><td>📝 Total questions</td><td>100</td></tr><tr><td>✅ Correct</td><td>${s.c}</td></tr><tr><td>❌ Wrong</td><td>${wr}</td></tr><tr><td>🏆 Total points</td><td>${s.p}</td></tr><tr><td>🎯 Accuracy</td><td>${pct}%</td></tr><tr><td>⭐ Stars</td><td>${s.f}</td></tr><tr><td>🏅 Medals</td><td>${WORLDS.filter((_,i)=>ans(i).length==10).length}/10</td></tr></table>
${all?'':'<p>Answer all 100 questions in the 10 worlds to win the trophy! (Đã làm '+s.n+'/100 câu)</p>'}
<button class="btn g" id="pa">🔄 PLAY AGAIN</button><button class="btn b" id="rv">🔍 REVIEW MISTAKES (${rv})</button><button class="btn" id="cw">🗺️ CHOOSE ANOTHER WORLD</button><button class="btn gh" id="hm">🏠 BACK TO HOME</button></div>`);
$('#pa').onclick=()=>{if(s.n&&!confirm('Start again? Your progress will be reset (best score is kept).'))return;ST.res={};save();startWorld(0)};
$('#rv').onclick=()=>{const l=[];Object.keys(ST.res).filter(k=>!ST.res[k].f).sort((a,b)=>a-b).forEach(k=>{const[w,i]=k.split('.').map(Number);l.push([w,i])});if(!l.length){say('No mistakes to review. Great!','good');return alert('No mistakes to review. Great job! 🌟')}cur={list:l,pos:0,rev:true};ask()};
$('#cw').onclick=home;$('#hm').onclick=home}
home();
</script></body></html>
